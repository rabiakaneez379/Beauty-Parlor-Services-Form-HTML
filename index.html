<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Beauty Parlor Services</h1>
    <div class="form-box">
        <label>Customer Name:</label>
        <input type="text"><br>

        <label>Select Services:</label><br>
        <input type="checkbox">Facial<br>
        <input type="checkbox">Makeup<br>
        <input type="checkbox">Manicure<br><br>

        <label>Service Type:</label><br>
        <input type="radio" name="service">Basic
        <input type="radio" name="service">Premium
        <input type="radio" name="service">VIP
        <br><br>

        <label>Select Appointment Time:</label>
        <select>
            <option>10:00 AM</option>
            <option>1:00 PM</option>
            <option>4:00 PM</option>
        </select><br><br>

        <button type="submit">Submit</button>
    </div>
</body>
</html>
